name: Testes e Deploy para GitHub Pages

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

# Em pull requests, um push novo cancela a execução anterior. Na main, as
# execuções esperam a vez, para não interromper um deploy no meio.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Checagens rápidas primeiro: se falharem, nem vale subir o emulador.
  quality:
    name: Qualidade de código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          # O histórico completo permite checar as mensagens dos commits novos.
          fetch-depth: 0

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Checar as mensagens de commit (pull request)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: Checar as mensagens de commit (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx commitlint --from ${{ github.event.before }} --to ${{ github.sha }}

      - name: Rodar o ESLint
        run: npm run lint

      - name: Checar a formatação
        run: npm run format:check

      - name: Checar os tipos
        run: npm run typecheck

  # O emulador pede um worker por máquina, então a suíte é dividida entre
  # máquinas (shards) em vez de entre workers. Cada shard roda uma parte.
  test:
    name: Testes E2E (shard ${{ matrix.shard }}/2)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Um shard que falha não cancela o outro: o relatório sai completo.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar os testes
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - name: Guardar o relatório parcial
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  # Junta os relatórios dos shards em um HTML só, com traces e capturas de
  # tela das falhas. Roda mesmo quando os testes falham.
  report:
    name: Relatório do Playwright
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Baixar os relatórios parciais
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Juntar os relatórios
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Publicar o relatório
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v4

      - name: Fazer upload dos arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy para o GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
